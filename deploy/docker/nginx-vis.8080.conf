# 将本文件以站点配置方式加载到 Nginx 的 http {} 上下文中。
# 仅公开业务输出目录；不要使用 /data/vis-interpolate 作为 alias，
# 以免暴露 assets、business/pipeline_state.sqlite 和 business.log。
# 服务器 /data 挂载点权限为 root:root 700。加载配置前必须向 nginx 用户
# 授予 /data、/data/vis-interpolate 的仅遍历 ACL，以及各输出目录的读取 ACL；
# 完整命令见 SERVER_10.148.16.18.md 的“浏览器查看业务输出”章节。

server {
    listen 8080;
    listen [::]:8080;
    server_name 10.148.16.18;

    # 生成结果可能为 .nc、.csv、.png 等，目录清单便于按日期浏览。
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    charset utf-8;

    # 默认不缓存目录清单；成品文件可在浏览器端短暂缓存。
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    # 各 URL 末尾的 / 必须保留，alias 的目录末尾也必须保留 /。
    location /vis/national/ {
        alias /data/vis-interpolate/vis_estimated_base_nation_station/;
    }

    location /vis/national-and-regional/ {
        alias /data/vis-interpolate/vis_estimated_base_nation_and_regional_station/;
    }

    location /vis/idw-national/ {
        alias /data/vis-interpolate/idw_nc/national/;
        default_type application/x-netcdf;
    }

    location /vis/idw-national-and-regional/ {
        alias /data/vis-interpolate/idw_nc/national_and_regional/;
        default_type application/x-netcdf;
    }

    location /vis/images/ {
        alias /data/vis-interpolate/vis_img/;
        expires 1h;
    }

    # 不意外开放其它路径；特别是 /data/vis-interpolate/assets 与 business。
    location / {
        return 404;
    }

    access_log /var/log/nginx/vis-interpolate-output.access.log;
    error_log /var/log/nginx/vis-interpolate-output.error.log warn;
}
